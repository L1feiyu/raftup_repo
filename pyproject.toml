[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raftup"
version = "0.1.2"
description = "RAFT-UP: Robust Alignment for Spatial Transcriptomics under Partial Overlapping"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "RAFT-UP developers"}]

dependencies = [

    "numpy",

    "scipy",

    "pandas",

    "networkx",

    "tqdm",

    "matplotlib",

    "seaborn",

    "plotly",

    "scikit-learn",

    "scanpy",

    "squidpy",

    "setuptools<81",

]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]