[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raftup"
version = "0.2.0.dev0"
description = "RAFT-UP: Robust Alignment for Spatial Transcriptomics under Partial Overlapping"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "RAFT-UP developers"}]

dependencies = [

    "numpy>=1.26,<2",

    "scipy>=1.11,<1.12",

    "pandas",

    "networkx",

    "tqdm",

    "matplotlib",

    "seaborn",

    "plotly",

    "scikit-learn",

    "scanpy",

    "squidpy",

    "setuptools<81",

]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
revision = ["anndata>=0.11,<0.12", "torch==2.1.0", "torch-geometric==2.6.1", "gudhi", "somoclu", "somde==0.1.8", "nbformat", "nbclient", "ipykernel", "jupyterlab", "pillow"]
